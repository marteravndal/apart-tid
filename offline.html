<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12251f">
  <title>Uten nett · Apart Tid</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f3;color:#12251f;font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}.card{width:min(480px,100%);padding:32px;background:#fff;border:1px solid #dce3df;border-radius:22px;box-shadow:0 18px 60px #12251f14}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#e86d3c;color:#fff;font:26px Georgia,serif}h1{margin:30px 0 10px;font:500 2.4rem Georgia,serif}p{color:#64706b}button{width:100%;margin-top:18px;border:0;border-radius:11px;padding:14px 18px;background:#12251f;color:#fff;font:inherit;font-weight:750;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">A</span>Apart Tid</div>
    <h1>Du er uten nett</h1>
    <p>Apart Tid trenger internett for sikker innlogging, dokumenter og inn- eller utstempling. Kontroller forbindelsen og prøv igjen.</p>
    <button onclick="location.reload()">Prøv igjen</button>
  </main>
</body>
</html>
